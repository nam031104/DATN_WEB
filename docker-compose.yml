services:
  mysql:
    image: mysql:8.4
    container_name: chickenmonitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: chickenmonitor
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mqtt:
    image: eclipse-mosquitto:2
    container_name: chickenmonitor-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  app:
    build: .
    container_name: chickenmonitor-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chickenmonitor?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-123456}
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      MQTT_CLIENT_ID: chickenmonitor-server
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      CAMERA_SERVICE_URL: ${CAMERA_SERVICE_URL:-http://192.168.1.9:8000}
      CAMERA_SERVICE_TOKEN: ${CAMERA_SERVICE_TOKEN:-chicken-secret}

volumes:
  mysql_data:
  mqtt_data:
  mqtt_log:
